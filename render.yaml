services:
  - type: web
    name: iapages-studio
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --no-audit --no-fund && npm run build
    startCommand: npm run dev
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: IAPAGES_PREVIEW_TOKEN_V2
        generateValue: true
      - key: IAPAGES_REQUIRE_PRIVATE_PREVIEW
        value: "true"
